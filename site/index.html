<body class="night-drive">
  <a class="skip-link" href="#catalog">Перейти к каталогу</a>
  <header class="header">
    <a class="brand" href="./" aria-label="F1ashko — весь каталог"><span class="brand-icon" aria-hidden="true">F1</span><span class="brand-wordmark">F1ASHKO<span class="brand-caption">АРХИВ кИно</span></span></a>
    <nav aria-label="Ссылки стримера" class="header-nav">
      <a class="nav-catalog" href="#catalog">Каталог</a>
      <a href="https://boosty.to/f1ashko" target="_blank" rel="noopener noreferrer">Boosty <span aria-hidden="true">↗</span></a>
      <a href="https://t.me/f1ASSko" target="_blank" rel="noopener noreferrer">Telegram <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-scene" aria-hidden="true"></div>
      <div class="hero-copy">
        <h1 id="hero-title">Эй, ты. <span>Наконец-то проснулся.</span></h1>
        <p class="hero-description">Фильмы, сериалы и шоу, которые смотрели вместе.</p>
        <div class="hero-stats" id="hero-stats" aria-label="Всего названий в каталоге"><span>Загружаем архив…</span></div>
      </div>

    </section>
    <section class="catalog-section" id="catalog" aria-labelledby="catalog-title">
      <div class="section-heading"><div><h2 id="catalog-title">КАТАЛОГ</h2></div></div>
      <div class="search-row"><label class="main-search"><span class="search-symbol" aria-hidden="true"></span><span class="sr-only">Поиск по названию</span><input id="title-search" type="search" autocomplete="off" placeholder="Название фильма, сериала или шоу…" maxlength="300"><kbd aria-hidden="true">/</kbd></label><button class="button mobile-filter-toggle" id="mobile-filters" aria-expanded="false" aria-controls="filter-panel">Фильтры <span id="mobile-filter-count"></span></button></div>
      <div class="catalog-layout">
        <aside class="filter-panel" id="filter-panel" aria-label="Фильтры каталога">
          <div class="filter-heading"><h3>Фильтры</h3><button class="text-button" id="reset-filters">Сбросить</button></div>
          <div id="filters"></div>

        </aside>
        <div class="results-panel">
          <div class="results-toolbar"><p id="result-count" role="status" aria-live="polite">Загружаем…</p><div class="toolbar-controls"><label class="sort-label"><span class="sr-only">Сортировка</span><select id="sort"><option value="watched-desc">Сначала новые просмотры</option><option value="watched-asc">Сначала старые просмотры</option><option value="rating-desc">По рейтингу Кинопоиска</option><option value="year-desc">По году выпуска</option><option value="title-asc">По названию А–Я</option></select></label><div class="view-switch" role="group" aria-label="Вид каталога"><button data-view="list" aria-label="Список" aria-pressed="true">☰</button><button data-view="grid" aria-label="Карточки" aria-pressed="false">▦</button></div></div></div>
          <div class="active-filters" id="active-filters" aria-label="Выбранные фильтры"></div>
          <div id="load-notice" class="load-notice" hidden></div>
          <div id="results" class="results-list" aria-busy="true"><div class="loading-card"></div><div class="loading-card"></div><div class="loading-card"></div></div>
          <div class="pagination-wrap"><label class="page-size">На странице <select id="page-size"><option>12</option><option selected>24</option><option>48</option><option>96</option></select></label><nav class="pagination" id="pagination" aria-label="Страницы каталога"></nav><span class="page-range" id="page-range"></span></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer"><div><strong>F1ASHKO <span>/ КИНОАРХИВ</span></strong></div><div class="sync-info"><p id="sync-status">Опубликованный снимок каталога</p></div></footer>
