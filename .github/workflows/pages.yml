name: Sync Google Sheet and publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: f1ashko-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      catalog_sha256: ${{ steps.catalog_hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source and parser
        run: |
          node --check site/app.js
          node --check site/catalog.js
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Read the current public Google Sheet
        run: python3 scripts/export_catalog.py
      - name: Test filters and validate published dataset
        run: node --test tests/*.test.js
      - name: Record catalog checksum
        id: catalog_hash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          digest = hashlib.sha256(Path('site/data/catalog.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha256={digest}\n')
          PY
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site and exact published catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_CATALOG_SHA256: ${{ needs.build.outputs.catalog_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          expected = os.environ['EXPECTED_CATALOG_SHA256']
          if not base.startswith('https://') or len(expected) != 64:
              raise SystemExit('Missing deployment URL or catalog checksum')
          def read(path, attempt):
              query = urllib.parse.urlencode({'verify': os.environ['GITHUB_RUN_ID'] + '-' + str(attempt)})
              request = urllib.request.Request(base + path + '?' + query, headers={'Cache-Control': 'no-cache', 'User-Agent': 'F1ashko-Pages-Check'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise ValueError(f'{path}: HTTP {response.status}')
                  return response.read()
          last_error = None
          for attempt in range(1, 13):
              try:
                  page = read('', attempt).decode('utf-8')
                  if 'f1ashko' not in page.lower() or 'night-drive' not in page or 'compact.css' not in page:
                      raise ValueError('Unexpected home page or older design')
                  if 'id="recording-only"' in page or 'hero-actions' in page or 'id="random-button"' in page:
                      raise ValueError('Removed controls are still present')
                  if 'АРХИВ <span>кИно</span>' not in page or 'assets/skyrim-awake.jpg' not in page:
                      raise ValueError('Skyrim hero update is not published yet')
                  if any(label in page for label in ('NIGHT SESSION', 'АРХИВ СТРИМОВ', 'id="data-coverage"', 'filter-footnote')):
                      raise ValueError('Removed labels are still present')
                  favicon = read('favicon.svg', attempt).decode('utf-8')
                  if '<title>F1</title>' not in favicon or '#f2ac00' not in favicon:
                      raise ValueError('Channel-colored F1 favicon is not published yet')
                  raw = read('data/catalog.json', attempt)
                  if hashlib.sha256(raw).hexdigest() != expected:
                      raise ValueError('CDN still serves an older catalog')
                  data = json.loads(raw)
                  records = data.get('records')
                  if not isinstance(records, list) or not records:
                      raise ValueError('Published catalog is empty or invalid')
                  for path in ('app.js', 'catalog.js', 'styles.css', 'night.css', 'compact.css', 'assets/skyrim-awake.jpg'):
                      if not read(path, attempt):
                          raise ValueError(f'{path}: empty file')
                  print(json.dumps({'url': base, 'http': 200, 'catalogChecksumMatches': True, 'design': 'skyrim-archive', 'favicon': 'black-gold-F1', 'generatedAt': data.get('generatedAt'), 'stats': data.get('stats')}, ensure_ascii=False))
                  break
              except (urllib.error.URLError, TimeoutError, ValueError, OSError) as error:
                  last_error = error
                  print(f'Live verification attempt {attempt}/12: {error}')
                  if attempt < 12:
                      time.sleep(5)
          else:
              raise SystemExit(f'Live verification failed: {last_error}')
          PY

  browser-check:
    if: github.event_name != 'schedule'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify live filters, pagination, reload and responsive design
        env:
          CATALOG_TEST_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python tests/ui_live.py
          python tests/ui_refresh.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
