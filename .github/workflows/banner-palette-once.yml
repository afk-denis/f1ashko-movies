name: Read banner palette once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/banner-palette-once.yml']
permissions: {}
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download supplied public banner
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          url='https://static-cdn.jtvnw.net/jtv_user_pictures/f1ashko-profile_banner-89d3c32b48cc087a-480.png'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=20) as response:
              data=response.read(4*1024*1024+1)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data)>4*1024*1024:
              raise SystemExit('Unexpected banner response')
          pathlib.Path('/tmp/f1ashko-banner.png').write_bytes(data)
          print('Banner downloaded:',len(data),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: favicon-palette-reference
          path: /tmp/f1ashko-banner.png
          retention-days: 1
