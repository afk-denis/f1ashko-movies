name: Apply requested branding once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/banner-palette-once.yml']
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic branding edits with source fingerprint checks
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          payload=''
          data=zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(data).hexdigest()=='6777ead8bc2e23eae2ab65e14381b22103d1b4afb1bc86ad7434a0b425553c6c', 'Transfer checksum mismatch'
          path=pathlib.Path('/tmp/apply-branding.py')
          path.write_bytes(data)
          subprocess.run(['python3',str(path)],check=True)
          PY
      - name: Verify changed source and catalog
        run: |
          git diff --check
          node --check site/app.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/export_catalog.py
          node --test tests/*.test.js
      - name: Commit scoped changes and remove one-time workflow
        run: |
          rm .github/workflows/banner-palette-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/app.js site/compact.css site/favicon.svg site/assets/SOURCES.md tests/branding.test.js tests/ui_live.py .github/workflows/pages.yml .github/workflows/banner-palette-once.yml
          git commit -m 'Use Skyrim hero, remove requested labels and add channel-colored F1 favicon'
          git push origin HEAD:main
