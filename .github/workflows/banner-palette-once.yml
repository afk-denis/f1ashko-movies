name: Apply requested branding once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/banner-palette-once.yml']
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the reviewed edits with corrected test indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          ref='305851b6a5403b77479bc0992b81ac42ac3e429e'
          text=subprocess.check_output(['git','show',ref+':.github/workflows/banner-palette-once.yml'],text=True)
          marker="          python3 - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PY',start)
          code=textwrap.dedent(text[start:end])
          lines=code.splitlines()
          matches=[i for i,line in enumerate(lines) if "line[8:] if line.startswith" in line]
          assert len(matches)==1
          lines[matches[0]]='extra = extra.rstrip() + chr(10)'
          path=Path('/tmp/branding-edits.py')
          path.write_text('\n'.join(lines)+'\n')
          subprocess.run(['python3',str(path)],check=True)
          PY
      - name: Verify changed source and catalog
        run: |
          git diff --check
          node --check site/app.js
          python3 -m py_compile tests/ui_live.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/export_catalog.py
          node --test tests/*.test.js
      - name: Commit only site and tests within token permissions
        run: |
          git restore .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/app.js site/compact.css site/favicon.svg site/assets/SOURCES.md tests/branding.test.js tests/ui_live.py
          git commit -m 'Use Skyrim hero, remove requested labels and add channel-colored F1 favicon'
          git push origin HEAD:main
