name: Import Skyrim background once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-skyrim-once.yml']

permissions:
  contents: write

concurrency:
  group: import-skyrim-background
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed image source and prepare local asset
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          source = 'https://cdn.mos.cms.futurecdn.net/hE9d4XxFd3YFaYyLxC8ZvQ.jpg'
          request = urllib.request.Request(source, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(4 * 1024 * 1024 + 1)
          if not 1000 < len(data) <= 4 * 1024 * 1024 or not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Unexpected image response; refusing to publish it')
          target = pathlib.Path('site/assets/skyrim-awake.jpg')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          digest = hashlib.sha256(data).hexdigest()
          pathlib.Path('site/assets/SOURCES.md').write_text(
              '# Background image source\n\n'
              'Skyrim opening-cart screenshot, used as the requested "You are finally awake" meme background.\n\n'
              f'Source image: {source}\n\n'
              'Meme reference: https://knowyourmeme.com/memes/toddroll-youre-finally-awake\n\n'
              f'SHA-256 of downloaded JPEG: `{digest}`\n\n'
              'The Elder Scrolls V: Skyrim imagery belongs to Bethesda/ZeniMax. '
              'No public-domain or open-license claim is made. '
              'The file is served locally by GitHub Pages; no visitor request goes to the image source.\n', encoding='utf-8')
          print('Imported local JPEG:', len(data), 'bytes; SHA-256:', digest)
          PY
      - name: Commit asset and remove this one-time importer
        run: |
          rm .github/workflows/import-skyrim-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/skyrim-awake.jpg site/assets/SOURCES.md .github/workflows/import-skyrim-once.yml
          git commit -m 'Store Skyrim meme image locally and remove one-time downloader'
          git push origin HEAD:main
      - name: Package exact working tree for review
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/f1ashko-skyrim-worktree.zip', 'w', compression=zipfile.ZIP_DEFLATED) as out:
              for name in files:
                  if name and pathlib.Path(name).is_file():
                      out.write(name, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skyrim-worktree
          path: /tmp/f1ashko-skyrim-worktree.zip
          retention-days: 1
